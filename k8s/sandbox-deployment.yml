apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      # Fix: use specific label to avoid collision with dynamic sandbox pods
      # (dynamic pods also have app:sandbox, which would confuse sandbox-service routing)
      app: sandbox-server

  template:
    metadata:
      labels:
        app: sandbox-server

    spec:
      serviceAccountName: resource-manager # needs rbac.yml deployed first
      containers:
        - name: main-sandbox-container
          image: 155149245210.dkr.ecr.ap-south-1.amazonaws.com/sandbox
          imagePullPolicy: IfNotPresent

          resources:
            limits:
              cpu: "1000m"
              memory: "2Gi"
            requests:
              cpu: "250m"
              memory: "500Mi"

          startupProbe:
            httpGet:
              path: /api/sandbox/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /api/sandbox/health
              port: 3000
            initialDelaySeconds: 2
            timeoutSeconds: 10
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: database
                  key: REDIS_URL
            - name: SANDBOX
              valueFrom:
                secretKeyRef:
                  name: database
                  key: SANDBOX
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /api/sandbox/health
              port: 3000
            initialDelaySeconds: 2
            timeoutSeconds: 10

          ports:
            - containerPort: 3000
              name: sandbox-port
