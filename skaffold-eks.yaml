apiVersion: skaffold/v4beta13
kind: Config

build:
  tagPolicy:
    sha256: {}
    
  platforms:
    - linux/amd64
  
  artifacts:
    - image: 155149245210.dkr.ecr.ap-southeast-1.amazonaws.com/ai-orchestration
      context: ai-orchestration
      docker:
        dockerfile: dockerfile

    - image: 155149245210.dkr.ecr.ap-southeast-1.amazonaws.com/auth
      context: auth
      docker:
        dockerfile: dockerfile

    - image: 155149245210.dkr.ecr.ap-southeast-1.amazonaws.com/notification
      context: notification
      docker:
        dockerfile: dockerfile
          
    - image: 155149245210.dkr.ecr.ap-southeast-1.amazonaws.com/agent
      context: sandbox/agent
      docker:
        dockerfile: dockerfile

    - image: 155149245210.dkr.ecr.ap-southeast-1.amazonaws.com/sync-agent
      context: sandbox/sync-agent
      docker:
        dockerfile: dockerfile

    - image: 155149245210.dkr.ecr.ap-southeast-1.amazonaws.com/sandbox
      context: sandbox/server
      docker:
        dockerfile: dockerfile

    - image: 155149245210.dkr.ecr.ap-southeast-1.amazonaws.com/router
      context: sandbox/router
      docker:
        dockerfile: dockerfile

    - image: 155149245210.dkr.ecr.ap-southeast-1.amazonaws.com/template
      context: sandbox/template
      docker:
        dockerfile: dockerfile

manifests:
  rawYaml:
    - k8s/secret-database.yml
    - k8s/secret-aws.yml
    - k8s/secret-jwt.yml
    - k8s/secret-google.yml
    - k8s/secret-ai.yml
    - k8s/rbac-serviceaccount.yml # Must come first — sandbox-deployment needs this SA
    - k8s/rbac-role.yml
    - k8s/rbac-rolebinding.yml
    - k8s/ai-deployment.yml
    - k8s/ai-service.yml
    - k8s/ingress.yml
    - k8s/router-deployment.yml
    - k8s/router-service.yml
    - k8s/sandbox-deployment.yml
    - k8s/sandbox-service.yml
    - k8s/auth-deployment.yml
    - k8s/auth-service.yml
    - k8s/notification-deployment.yml
    - k8s/notification-service.yml
